<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample jayaprakash HTML Page</title>
    <style>
        body {
            background-color: #f4f7fa;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            margin: 40px;
        }
        h1 {
            color: #2779bd;
            font-size: 2.5em;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        ul {
            background: #e3eafe;
            padding: 16px 24px;
            border-radius: 8px;
            width: fit-content;
        }
        ul li {
            font-size: 1em;
            margin: 8px 0;
            color: #505050;
        }
        a {
            color: #2779bd;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        a:hover {
            color: #184262;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Welcome to jp My Sample Page</h1>
    <p>This is a paragraph of text on the sample HTML page.</p>
    <ul>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>
    <a href="https://www.example.com" target="_blank">Visit Example.com</a>
</body>
</html>
