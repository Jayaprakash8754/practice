name: Test GitHub Action Workflow

on:
  push:
    branches:
      - test_github_action
  pull_request:
    branches:
      - test_github_action

jobs:
  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Show branch name
        run: echo "Branch name: ${{ github.ref }}"
      
      - name: List files
        run: ls -l
